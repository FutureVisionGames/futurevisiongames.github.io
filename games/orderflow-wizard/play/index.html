<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orderflow Wizard</title>
<style>
/* Tape Reader: full-window canvas game (highway, time & sales, mini chart) with DOM sheets for menus and results */
:root{
  --bg:#07080d;--panel:#10121b;--panel2:#161927;--line:#232741;--line2:#30365a;
  --text:#eef0f8;--sub:#a3a9c6;--dim:#646a8c;
  --buy:#2ee6a0;--sell:#ff4d6d;--gold:#ffc94d;--cyan:#38d6d6;--violet:#9b7bff;--accent:#ff8a3d;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* sheets */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(30,24,70,.72),rgba(4,5,10,.9));backdrop-filter:blur(4px)}
.ov[hidden]{display:none!important}
.sheet{width:min(980px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#13152200,#131522 40%),var(--panel);border:1px solid var(--line2);border-radius:18px;padding:26px 28px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.sheet.narrow{width:min(620px,100%)}
.kick{font:800 12px/1 var(--ui);letter-spacing:.24em;color:var(--cyan)}
.logo{font:900 clamp(42px,7.5vw,76px)/.95 var(--ui);letter-spacing:.06em;margin:8px 0 6px;background:linear-gradient(90deg,var(--sell),#ff9d5c 40%,var(--gold) 55%,var(--buy));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:#c9cde4;font-size:15px;max-width:70ch;margin:6px 0 0}
.sheet h2{font:900 26px/1.15 var(--ui);margin:8px 0 6px}
.sheet p{color:var(--sub);margin:8px 0;max-width:72ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 8px}
.track{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:border-color .15s,transform .15s}
.track:hover{border-color:var(--line2);transform:translateY(-2px)}
.track.on{border-color:var(--cyan);background:#11202a}
.track .nm{font:900 16px/1.2 var(--ui)}
.track .tm{font:700 11px/1 var(--mono);color:var(--dim)}
.track .bpm{font:900 26px/1 var(--mono);margin-top:auto}
.track .bpm small{font:700 11px/1 var(--ui);color:var(--dim);margin-left:4px;letter-spacing:.1em}
.bars{display:flex;gap:3px;align-items:flex-end;height:16px}
.bars i{display:block;width:6px;border-radius:2px;background:#2a2f4d}
.bars i.on{background:var(--accent)}
.track .best{font:700 11px/1 var(--ui);color:var(--gold)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:#0b0c14;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;border:0;border-radius:7px;padding:8px 14px;font:800 12px/1 var(--ui);letter-spacing:.06em;color:var(--sub)}
.seg button.on{background:var(--line2);color:var(--text)}
.lbl{font:800 10px/1 var(--ui);letter-spacing:.14em;color:var(--dim);margin-right:4px}
.cta{background:linear-gradient(90deg,#ff6a3d,#ff9d4d);color:#1b0a02;border:0;border-radius:12px;padding:14px 24px;font:900 15px/1 var(--ui);letter-spacing:.08em;box-shadow:0 8px 30px rgba(255,120,60,.25)}
.cta:hover{filter:brightness(1.08)}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:12px;padding:12px 16px;font:700 13px/1 var(--ui);color:var(--text)}
.ghost:hover{border-color:var(--sub)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.disc{margin-top:16px;padding:10px 12px;border-radius:10px;background:#17140a;border:1px solid #4d3f12;font:12px/1.5 var(--ui);color:#e8d48f}
.hint{font:12px/1.5 var(--ui);color:var(--dim)}
kbd{font:800 11px/1 var(--mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line2);background:#0b0c14;color:var(--text)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.how>div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.how b.t{display:block;font:900 15px/1.2 var(--ui);margin-bottom:6px}
.how p{margin:4px 0;font-size:13px}
.tell{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
.tell div{padding:8px 10px;border-radius:10px;background:#0b0c14;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.tell b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv .k{font:800 10px/1 var(--ui);letter-spacing:.12em;color:var(--dim)}
.kv .v{font:900 22px/1.2 var(--mono);margin-top:6px}
.kv .s{font:12px/1.4 var(--ui);color:var(--sub);margin-top:2px}
.grade{font:900 92px/1 var(--ui);letter-spacing:-.02em}
.res-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.calls{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.calls span{font:800 12px/1 var(--mono);padding:6px 8px;border-radius:8px;border:1px solid var(--line2)}
.calls .ok{color:var(--buy);border-color:#1f6b52;background:#0b1f18}
.calls .no{color:var(--sell);border-color:#6b1f30;background:#200b10}
input[type=range]{accent-color:var(--cyan);width:180px}
.set{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.set output{font:800 12px/1 var(--mono);color:var(--sub);min-width:64px}


.big1{font:900 clamp(20px,2.6vw,28px)/1.25 var(--ui);margin:10px 0 4px;color:var(--text)}
.keys3{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.keys3 span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font:800 14px/1 var(--ui);color:var(--sub)}
.keys3 b{font:900 22px/1 var(--ui);color:var(--text)}
b.g,.keys3 b.g{color:var(--buy)}b.r,.keys3 b.r{color:var(--sell)}
.rule{margin:14px 0;padding:16px 18px;border-radius:14px;background:#0b1a1f;border:1px solid #1e5a63;font:600 17px/1.6 var(--ui);color:#e6fbfc}
.rule b{color:#fff}
.track.lvl{min-height:140px}
.track.locked{opacity:.45;cursor:not-allowed}
.track .stars{font:900 18px/1 var(--ui);color:var(--gold);letter-spacing:.1em;margin-top:auto}
.chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:18px 0 8px}
.chap{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:170px;transition:border-color .15s,transform .15s}
button.chap:hover{border-color:var(--cyan);transform:translateY(-2px)}
.chap .ic{font-size:28px;line-height:1}
.chap .tm{font:700 11px/1 var(--mono);color:var(--dim)}
.chap .nm{font:900 17px/1.2 var(--ui)}
.chap .stars{margin-top:auto;font:900 14px/1 var(--ui);color:var(--gold)}
.chap.soon{opacity:.5}
.chap .soonTag{margin-top:auto;font:800 10px/1 var(--ui);letter-spacing:.14em;color:var(--violet)}
.rank{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:#151233;border:1px solid #3b2f7a}
.rank .hat{font-size:34px;line-height:1}
.rank .k{font:800 9px/1 var(--ui);letter-spacing:.14em;color:#9b8cff}
.rank .v{font:900 20px/1.2 var(--ui);color:#efeaff}
.rank .s{font:12px/1.3 var(--ui);color:var(--sub)}
.rule.small{font-size:14px;line-height:1.6}
b.gl{color:var(--gold)}
b.pk{color:#ff7ad9}
.logo{font-size:clamp(36px,6vw,64px)}
.h3{font:900 16px/1.2 var(--ui);margin:18px 0 8px;color:var(--text)}
.coaches{display:grid;gap:8px}
.coach{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font:13px/1.5 var(--ui);color:#d9dcf0}
.coach.ok{border-color:#1f6b52}.coach.no{border-color:#6b1f30}
.coach i{color:var(--gold);font-style:normal;font-weight:700;margin-left:6px}
.toast{position:fixed;right:16px;z-index:80;display:flex;gap:12px;align-items:center;min-width:260px;max-width:360px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#231b4d,#14122b);border:1px solid #7a62ff;box-shadow:0 14px 40px rgba(0,0,0,.5);transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
.toast.show{transform:none}
.toast .ti{font-size:32px;line-height:1}.toast .tk{font:800 9px/1 var(--ui);letter-spacing:.16em;color:#b3a4ff}.toast .tn{font:900 16px/1.3 var(--ui);color:#fff}.toast .td{font:12px/1.3 var(--ui);color:var(--sub)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.badge{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);opacity:.4;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:#7a62ff;background:#18153a}
.badge .bi{font-size:28px;line-height:1}.badge b{font:900 14px/1.2 var(--ui)}.badge span{font:12px/1.35 var(--ui);color:var(--sub)}.badge i{font:700 10px/1 var(--mono);color:#b3a4ff;font-style:normal}
.jt{width:100%;border-collapse:collapse;margin:10px 0;font:13px/1.3 var(--mono)}
.jt th{font:800 10px/1 var(--ui);letter-spacing:.1em;color:var(--dim);text-align:right;padding:8px;border-bottom:1px solid var(--line2)}
.jt td{text-align:right;padding:8px;border-bottom:1px solid var(--line)}
.jt th:first-child,.jt td:first-child{text-align:left;font-family:var(--ui);font-weight:700}
.spark{display:flex;gap:3px;height:96px;align-items:center;padding:4px 0;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2);background:linear-gradient(transparent 49.5%,#30365a 49.5%,#30365a 50.5%,transparent 50.5%)}
.spark i{display:block;width:12px;border-radius:2px}
.spark{flex-direction:row}
select,.fields input{background:#0b0c14;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font:600 13px var(--ui)}
.fields label{display:inline-flex;gap:6px;align-items:center;font:700 12px var(--ui);color:var(--sub)}
input[type=file]{font:12px var(--ui);color:var(--sub)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.banner{margin:10px 0;padding:10px 14px;border-radius:12px;background:#2a2108;border:1px solid #7a5d12;color:#ffe2a0}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .4s}
.gate.hide{opacity:0;pointer-events:none}
#gateBtn{background:transparent;border:1px solid rgba(160,112,240,.6);color:#d9ccff;border-radius:999px;padding:14px 28px;font:800 13px/1 var(--ui);letter-spacing:.24em;animation:pulse 2.2s ease-in-out infinite}
#gateBtn:hover{background:rgba(160,112,240,.12)}
.gate .g2{font:12px/1.4 var(--ui);color:#7d82a8}
.sp-after{position:absolute;left:0;right:0;top:52%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 16px;opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.sp-after.show{opacity:1;transform:none;pointer-events:auto}
.sp-after .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:0 0 14px;padding-left:.6em}
.sp-after .sp-title{font:900 clamp(38px,8vw,88px)/0.95 var(--ui);letter-spacing:.08em;padding-left:.08em;background:linear-gradient(90deg,var(--sell),#ff9d5c 40%,var(--gold) 55%,var(--buy));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-after .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance}
.sp-after #enterBtn{opacity:1;animation:pulse 2.2s ease-in-out 1s infinite}
@media (max-height:620px){.sp-after{top:48%}.sp-after .presents{margin-bottom:6px}}
/* landing page */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(90deg,#0a0e20 0%,#11102a 50%,#171133 100%);transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .grid{position:absolute;left:-50%;right:-50%;bottom:-2px;height:42vh;transform:perspective(320px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(56,214,214,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(150,110,255,.5) 1px,transparent 1px);background-size:46px 46px;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%);animation:gridmove 1.6s linear infinite}
@keyframes gridmove{to{background-position:0 46px,0 0}}
#splash .glow{position:absolute;left:50%;bottom:30vh;width:70vmin;height:70vmin;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle,rgba(46,230,160,.12),rgba(255,77,109,.08) 45%,transparent 70%);pointer-events:none}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:100%}
.sp-in .fvg{width:min(640px,86vw);height:auto;display:block;filter:drop-shadow(0 10px 40px rgba(120,90,255,.25));opacity:0;animation:spIn 1s ease .1s forwards}
.sp-in .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:26px 0 14px;padding-left:.6em;opacity:0;animation:spIn .8s ease .9s forwards}
.sp-in .sp-title{font:900 clamp(46px,9vw,96px)/0.95 var(--ui);letter-spacing:.08em;padding-left:.08em;background:linear-gradient(90deg,var(--sell),#ff9d5c 40%,var(--gold) 55%,var(--buy));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:spIn .9s ease 1.3s forwards}
.sp-in .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance;opacity:0;animation:spIn .8s ease 1.7s forwards}
#enterBtn{margin-top:30px;background:transparent;border:1px solid rgba(56,214,214,.55);color:#9ff0f0;border-radius:999px;padding:13px 26px;font:800 12px/1 var(--ui);letter-spacing:.22em;opacity:0;animation:spIn .8s ease 2.1s forwards,pulse 2.2s ease-in-out 3s infinite}
#enterBtn:hover{background:rgba(56,214,214,.1)}
.sp-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:11px/1.5 var(--ui);color:#6d7396;padding:0 16px}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(56,214,214,0)}50%{box-shadow:0 0 0 6px rgba(56,214,214,.12)}}
@media (prefers-reduced-motion:reduce){#splash .grid{animation:none}.sp-in *,#enterBtn{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Orderflow Wizard"></canvas>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="splash" role="dialog" aria-label="Future Vision Games presents Orderflow Wizard">
  <canvas id="introCv" aria-hidden="true"></canvas>
  <div id="gate" class="gate"><button type="button" id="gateBtn">▶&nbsp; CLICK TO START</button><div class="g2">🔊 Sound on for the full experience</div></div>
  <div id="spAfter" class="sp-after">
    <div class="presents">PRESENTS</div>
    <div class="sp-title">ORDERFLOW WIZARD</div>
    <div class="sp-tag">Read the tape, the order book, the heatmap and the footprint. See where price is going.</div>
    <button type="button" id="enterBtn">CLICK OR PRESS ANY KEY</button>
  </div>
  <div class="sp-foot">© 2026 Future Vision Games · All money in this game is simulated</div>
</div>

<script>
'use strict';
/* ═══════════════════════════  TAPE READER  ═══════════════════════════
   A time & sales rhythm game by Future Vision Games.
   Price paths come from real NQ 5-minute candles (09:30–16:00 New York).
   The individual prints (time & sales) and the order-flow patterns are
   reconstructed from those candles, so they are simulated. Money is simulated. */

// ── helpers ─────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtP=p=>{const d=TICKDEC();return p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
const fmt$=(v,sign)=>{const n=Math.round(v);return (n<0?'-':(sign&&n>0?'+':''))+'$'+Math.abs(n).toLocaleString('en-US');};
// ── instrument: built-in NQ, or the user's own CSV (TradingView export) saved in localStorage ──
const INSTR={sym:'NQ',name:'NQ futures',lot:'MNQ',tick:0.25,pval:2,fee:0.74,custom:false,src:'built-in, Jun–Oct 2026'};
const TICKDEC=()=>{const s=String(INSTR.tick);return s.includes('.')?s.split('.')[1].length:0;};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const median=a=>{const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)];};
const NQ_PVAL=20;

// ── data: tracks are 30-minute stretches of real sessions ─────────────────
for(const d of SESSIONS){if(d.t0===undefined)d.t0=34200;if(!d.tf)d.tf=300;}
const NQ_MEDVOL=median(SESSIONS.flatMap(d=>d.c.map(c=>c[4])));
const NQ_MEDRANGE=median(SESSIONS.flatMap(d=>d.c.map(c=>c[1]-c[2])));
(function loadCustom(){
  const D=store.get('ow_data',null);if(!D||!D.sessions||!D.sessions.length)return;
  SESSIONS.length=0;for(const s of D.sessions)SESSIONS.push({d:s.d,w:s.w,t0:s.t0,tf:s.tf,c:s.c.map(c=>c.slice())});
  // volumes are rescaled so a typical candle trades like a typical NQ candle (the simulated sizes stay comparable)
  const all=SESSIONS.flatMap(d=>d.c),mv=median(all.map(c=>c[4]));
  if(mv>0){const f=NQ_MEDVOL/mv;for(const c of all)c[4]=Math.max(1,c[4]*f);}
  else{const mr=median(all.map(c=>c[1]-c[2]))||1;for(const c of all)c[4]=NQ_MEDVOL*clamp((c[1]-c[2])/mr,0.3,3);}
  Object.assign(INSTR,{sym:D.sym,name:D.name||D.sym,lot:D.lot||D.sym,tick:D.tick,pval:D.pval,fee:D.fee,custom:true,src:D.src||'your CSV'});
})();
// clock time of a moment inside a session (k = candle index, may be fractional)
function clockAt(day,k){let s=Math.round(day.t0+k*day.tf);s=((s%86400)+86400)%86400;return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function niceBin(raw){const T=INSTR.tick;for(const m of [1,2,4,5,8,10,20,25,40,50,100,200,250,400,500,1000,2000,2500,4000,5000,10000,20000,50000]){const s=+(T*m).toFixed(8);if(s<raw-1e-9)continue;
  const e=Math.pow(10,Math.floor(Math.log10(s)+1e-9)),f=+(s/e).toFixed(6);if(m<=4||[1,2,2.5,5].includes(f))return s;}return +(T*50000).toFixed(8);}
const ALLC=SESSIONS.flatMap(d=>d.c);

const SEGS=[
  {id:'open', name:'Opening Bell',  from:0,  hint:'The busiest half hour of the day'},
  {id:'drive',name:'Morning Drive', from:6,  hint:'Trends often start here'},
  {id:'mid',  name:'Lunch Groove',  from:30, hint:'Thin, slow, full of traps'},

const segVol=(di,from)=>SESSIONS[di].c.slice(from,from+SEG_LEN).reduce((s,c)=>s+c[4],0);

function makeTrack(sg,di){
  const ratio=segVol(di,sg.from)/MED_SEGVOL;
  const bpm=Math.round(clamp(118+30*Math.log2(ratio),92,168));

}
let TRACKS=[];

  const days=SESSIONS.map((_,i)=>i).sort(()=>Math.random()-0.5);
  TRACKS=SEGS.map((sg,i)=>makeTrack(sg,days[i]));
}
dealTracks();

const DIFFS={
  easy:  {name:'EASY',  tempo:0.88,notes:5, gap:4,absorb:4,sweep:4,sweepGap:2,win:1.35,speed:360,hints:true},

  lv:  {name:'LEVEL',tempo:1,notes:3,gap:5,absorb:4,sweep:4,sweepGap:2,win:1,speed:400,hints:false},
  lv2: {name:'LEVEL',tempo:1,notes:5,gap:3,absorb:3,sweep:3,sweepGap:2,win:1,speed:400,hints:false},
  pro: {name:'PRO',tempo:1,notes:7,gap:3,absorb:3,sweep:3,sweepGap:2,win:1,speed:400,hints:false},
  hard:  {name:'HARD',  tempo:1.08,notes:12,gap:2,absorb:3,sweep:3,sweepGap:1,win:0.85,speed:580,hints:false},

const OPT={diff:store.get('tr_diff','normal'),off:store.get('tr_off',0),vol:store.get('tr_vol',0.8)};
if(!DIFFS[OPT.diff]||OPT.diff==='tutorial')OPT.diff='normal';

// ── tape synthesis ────────────────────────────────────────────────────────
// Each 5-minute candle becomes 8 bars of 16th notes (128 slots). The price walks
// open → first extreme → second extreme → close (low first on green candles, high
// first on red ones), and prints are scattered along that walk. Before each CALL the
// tape shows one of three tells: absorption, a sweep or a balanced (two-sided) tape.
const CSLOTS=128;
function buildSong(tr,diffKey){
  const D=DIFFS[diffKey],R=mulberry32(tr.seed+(diffKey==='hard'?3:diffKey==='easy'?1:2));
  const day=SESSIONS[tr.di],cs=day.c.slice(tr.from,tr.from+(tr.n||SEG_LEN));
  const bpm=Math.round(tr.bpm*D.tempo),slot=60/bpm/4;
  const song={n:cs.length,tr,diff:diffKey,D,bpm,slot,beat:slot*4,slots:[],notes:[],calls:[],prints:[],cs,day,
    lo:Math.min(...cs.map(c=>c[2])),hi:Math.max(...cs.map(c=>c[1]))};
  // pitch is centred on the first print, so the melody never hints at the range still to come
  song.pitchMid=cs[0][0];song.pitchStep=Math.max(0.5,MED_RANGE/8);
  let idx=0;
  const push=o=>{o.i=idx;o.t=idx*slot;song.slots.push(o);idx++;return o;};
  for(let s=0;s<16;s++)push({kind:'count',pos:s,price:cs[0][0],k:0});
  let pv=0,vv=0; // VWAP of completed candles
  const thr=Math.max(12*INSTR.tick,0.22*MED_RANGE);
  for(let k=0;k<cs.length;k++){
    const [o,h,l,c,v]=cs[k],range=Math.max(INSTR.tick,h-l),bull=c>=o;
    const e1=bull?l:h,e2=bull?h:l;
    const d1=Math.abs(e1-o),d2=Math.abs(e2-e1),d3=Math.abs(c-e2),tot=d1+d2+d3||1;
    const volRatio=v/MED_VOL;
    let type=range<0.55*MED_RANGE?'flat':(d1>0.18*range?'rev':'cont');
    // leg lengths in slots (bar-aligned where the call needs it)
    let a1,a2,a3,callAt;

      a1=clamp(Math.round(CSLOTS*d1/tot/16)*16,16,96);
      a2=clamp(Math.round(CSLOTS*d2/tot),16,CSLOTS-a1-8);a3=CSLOTS-a1-a2;callAt=a1;
    } else {
      a1=clamp(Math.round(CSLOTS*d1/tot),6,40);a2=clamp(Math.round(CSLOTS*d2/tot),40,CSLOTS-a1-6);a3=CSLOTS-a1-a2;
      callAt=0;
    }
    // base path
    const base=new Array(CSLOTS);
    const legs=[[o,e1,a1],[e1,e2,a2],[e2,c,a3]];
    let s0=0;const noiseAmp=range*0.05;
    for(const [pa,pb,n] of legs){for(let j=0;j<n;j++){const f=n>1?j/(n-1):1;const e=f*f*(3-2*f);
      const nz=(R()-0.5)*2*noiseAmp*Math.sin(Math.PI*f);base[s0+j]=snap(clamp(pa+(pb-pa)*(0.35*f+0.65*e)+nz,l,h));}s0+=n;}
    base[0]=o;base[a1-1]=e1;base[a1+a2-1]=e2;base[CSLOTS-1]=c;
    if(type==='cont'){callAt=clamp(Math.round((a1+a2*0.4)/16)*16,Math.max(16,Math.ceil((a1+8)/16)*16),a1+a2-16);
      if(callAt<16||callAt>a1+a2-12)type='flat';}
    if(type==='flat'){let best=64,bd=1e9;for(let cA=32;cA<=96;cA+=16){const dd=Math.abs(c-base[cA-1]);if(dd<bd){bd=dd;best=cA;}}callAt=best;}
    const resolveS=type==='flat'?CSLOTS-1:Math.max(callAt+12,Math.min(CSLOTS-1,a1+a2-1));
    const legDir=s=>{const p=s<a1?Math.sign(e1-o):s<a1+a2?Math.sign(e2-e1):Math.sign(c-e2);return p||1;};
    // tells
    const tell={};let tellFrom=callAt-16;const call={k,type,hint:''};
    if(type==='rev'){

      for(let j=0;j<n;j++){const s=callAt-2-2*j;tell[s]={side:dir1,price:e1,size:40+Math.floor(R()*50),tag:'absorb'};}
      for(let s=callAt-2*n-1;s<callAt;s++)base[s]=snap(clamp(e1-dir1*(R()<0.5?0:INSTR.tick),l,h));

    const dens=clamp(0.3*Math.pow(volRatio,0.6),0.2,0.75);
    const cand=[];const slotPrints=[];
    let prevP=k?song.slots[song.slots.length-1].price:o;

}

// ═══════════════════════  ORDER-FLOW ENGINE (shared by Heatmap, Book, Footprint, Arena)  ═══════════════════════
// Price is the real NQ path: each 5-minute candle is split into 120 columns (≈2.5 s each) that hit its
// real open, high, low and close. The order book, the trades and their sizes are simulated around that
// path, so the liquidity "explains" what price really did next. Events placed on the real path:
//   hold    – a big resting wall where price really turned                → bounce
//   iceberg – no wall showing, but a hidden order keeps refilling          → bounce
//   spoof   – a wall in the way that is pulled just before price reaches it → break
//   thin    – little resting ahead (or a wall that gets eaten), aggressors pushing → break
// lv.h (0…1) is how hard the level is: weaker or noisier tells, later pulls, more decoys and noise.
const CPC=120;
const HPOOL={bounce:[],brk:[],stop:[],casc:[]};
SESSIONS.forEach((d,di)=>d.c.forEach((c,k)=>{if(k<2||k>77)return;const [o,h,l,cl]=c,range=h-l;if(range<0.8*MED_RANGE)return;
  const bull=cl>=o,e1=bull?l:h,e2=bull?h:l,d1=Math.abs(e1-o),d2=Math.abs(e2-e1);
  if(d1>0.25*range&&d2>0.6*range)HPOOL.bounce.push([di,k]);if(d2>0.7*range&&d1<0.3*range){HPOOL.brk.push([di,k]);if(range>1.1*MED_RANGE)HPOOL.casc.push([di,k]);}
  // stop runs: the first leg pokes past the extreme of the two candles before, then the candle reverses hard
  if(k>=3&&d2>0.55*range){const p1=d.c[k-1],p2=d.c[k-2],old=bull?Math.min(p1[2],p2[2]):Math.max(p1[1],p2[1]),past=(old-e1)*(bull?1:-1);
    if(past>=Math.max(2*INSTR.tick,0.04*MED_RANGE)&&past<0.45*range&&d1>past*1.3)HPOOL.stop.push([di,k,old]);}}));

// fine path inside one candle: open → first extreme → second extreme → close, exact at each
function candlePath(c,R,pin){
  const [o,h,l,cl]=c,bull=cl>=o,e1=bull?l:h,e2=bull?h:l;
  const d1=Math.abs(e1-o),d2=Math.abs(e2-e1),d3=Math.abs(cl-e2),tot=d1+d2+d3||1;
  let a1=Math.max(8,Math.round(CPC*d1/tot)),a2=Math.max(20,Math.round(CPC*d2/tot));if(a1+a2>CPC-6){a2=CPC-6-a1;}const a3=CPC-a1-a2;
  const out=[],amp=(h-l)*0.06;
  const pinN=pin?Math.min(pin,a1-4):0,away=Math.sign(e2-e1)||1;
  for(const [pa,pb,n0,leg] of [[o,e1,a1,1],[e1,e2,a2,2],[e2,cl,a3,3]]){
    const n=leg===1?n0-pinN:n0;let w=0;const walk=[0];for(let j=1;j<n;j++){w+=(R()-0.5)*2;walk.push(w);}
    for(let j=0;j<n;j++){const f=n>1?j/(n-1):1,br=walk[j]-f*walk[n-1];out.push(snap(clamp(pa+(pb-pa)*f+br*amp*0.45,l,h)));}
    out[out.length-1]=pb;
    // price arrives at the first extreme early, then keeps testing it without getting through
    if(leg===1&&pinN){for(let j=0;j<pinN;j++)out.push(j===pinN-1?e1:snap(clamp(e1+away*INSTR.tick*[1,0,2,1,0,2][j%6],l,h)));}}
  return {path:out,a1,a2,a3,e1,e2,bull,range:h-l,d1,d2};
}
function breakDec(path,s2,n2,L,dir,d2){const tol=Math.max(3*INSTR.tick,1.6*d2/n2);for(let j=s2;j<s2+n2;j++){const gap=(L-path[j])*dir;if(gap<=tol&&gap>0)return j;if(gap<=0)return -1;}return -1;}
function newEvent(type,L,dir,dec,res,R,h){
  const e={type,L,dir,dec,res,bounce:type==='hold'||type==='iceberg'||type==='stoprun',pull:-1};
  if(type==='spoof')e.pull=dec-Math.max(2,5-Math.round(3*h));
  if(type==='thin'&&h>=0.6&&R()<0.5)e.eaten=true;
  return e;
}
// one quiz round: two real candles, the question at an event in the second one
function makeScenario(type,lv){
  const h=lv.h||0,bounce=type==='hold'||type==='iceberg'||type==='stoprun',pool=type==='stoprun'?HPOOL.stop:type==='cascade'&&HPOOL.casc.length>8?HPOOL.casc:bounce?HPOOL.bounce:HPOOL.brk;const PRE=lv.pre||110;
  if(!pool.length)return null;
  for(let tries=0;tries<60;tries++){
    const [di,k,old]=pool[Math.floor(Math.random()*pool.length)],day=SESSIONS[di],R=mulberry32((Math.random()*1e9)>>>0);
    const A=candlePath(day.c[k-1],R),B=candlePath(day.c[k],R,bounce&&type!=='stoprun'?12:0);
    const path=A.path.concat(B.path),base=CPC;let L,dec,res,dir,start;
    if(type==='stoprun'){
      L=old;dir=Math.sign(B.e2-B.e1);dec=base+B.a1-1;res=base+B.a1+B.a2-1;start=-1;
      for(let j=base;j<=dec;j++)if((path[j]-L)*dir<0){start=j;break;}
      if(start<0||dec-start<4)continue;
    } else if(bounce){
      if(B.a1<16)continue;

      let bad=false;for(let j=Math.max(0,dec-PRE);j<dec-12;j++)if((path[j]-L)*dir<0)bad=true;if(bad)continue;
    } else {

    }
    if(dec-PRE<0)continue;

    const ev=newEvent(type,L,dir,dec,res,R,h);if(type==='stoprun')ev.start=start;

function buildBook(o){

  const margin=Math.max(0.25*MED_RANGE,(hi-lo)*0.35);lo-=margin;hi+=margin;
  const rawB=(hi-lo)/130,bsz=niceBin(rawB);const binLo=+(Math.floor(lo/bsz)*bsz).toFixed(8),nb=Math.ceil((hi-binLo)/bsz)+1;
  const binOf=p=>clamp(Math.floor((p-binLo)/bsz+1e-9),0,nb-1);

  const target=new Float32Array(nb),v=new Float32Array(nb),touched=new Int32Array(nb).fill(-999);
  for(let b=0;b<nb;b++){const p=binLo+b*bsz;let t=25+Math.exp(R()*2.2)*12;const q=p/bsz;if(Math.abs(q/10-Math.round(q/10))<1e-6)t*=2;if(Math.abs(q/50-Math.round(q/50))<1e-6)t*=1.8;target[b]=t;v[b]=t*(0.7+R()*0.6);}

  const decoys=[],nd=2+(h>=0.5?1:0)+(nc>300?3:0);
  for(let i=0;i<nd;i++){const above=R()<0.5,near=h>=0.6&&i===0;const off=near?2+Math.floor(R()*2):4+Math.floor(R()*8);const b=above?pbMax+off:pbMin-off;if(b>=0&&b<nb)decoys.push([b,380+R()*420]);}
  for(const e of events){e.LB=binOf(e.L);e.wall=950-380*h*R();e.wall0=e.wall;}
  // scattered medium resting levels (yellow/orange on the map), never right on an event level
  const nMid=Math.round(nb*(0.07+0.06*h));for(let i=0;i<nMid;i++){const b=Math.floor(R()*nb);if(events.some(e=>Math.abs(b-e.LB)<=2))continue;target[b]=Math.max(target[b],150+R()*280);v[b]=target[b];}

// Bookmap-like palette: black → deep blue → cyan → yellow → orange → white-hot
const HSTOPS=[[0,[6,8,18]],[40,[16,32,90]],[110,[24,90,170]],[220,[30,190,210]],[380,[240,220,60]],[620,[255,140,30]],[900,[255,250,235]]];
// the heatmap image (1 px per column × price bin), redrawn when the contrast changes
const VIEW={zt:1,zp:1,ct:store.get('ow_ct',1),bub:store.get('ow_bub',1.35),alerts:store.get('ow_alerts',true)};
const BUBS=[1.35,2,3,5,8],CTS=[0.6,0.8,1,1.3,1.7,2.2];
function heatImg(R){

// ── shared round mechanics for the order-flow quiz scenes ─────────────────
const BOOKSCENE={
  sched(R){
    if(!AU.ac)return;const spb=60/100,slot=spb/4,tEnd=R.start+R.preDur;
    for(let t=R.start,i=0;t<tEnd-0.01;t+=slot,i++){const p=i%16;
      if(p===0||p===10)INST.kick(t,0.7);if(p===8)INST.snare(t,0.45);if(p%4===2)INST.hat(t,0.4);
      if(p===0)INST.pad(t,[57,60,64],spb*4*0.95,0.7);if(p===0||p===8)INST.bass(t,33,slot*2,0.6);}
    const S0={pitchMid:R.path[R.dec],pitchStep:Math.max(0.5,MED_RANGE/8)};
    for(const tr of R.trades){if(tr.c>R.dec)break;const t=R.start+(tr.c-R.c0)/R.lv.cps,v=tr.b+tr.s;if(v<R.volMed*0.8)continue;
      const side=tr.b>=tr.s?1:-1,m=priceMidi(S0,tr.p,side);(tr.b>=60||tr.s>=60)?INST.stab(t,m-12,0.55):INST.pluck(t,m,0.025+0.015*Math.log2(1+v));}
    if(R.pull>0)noise(R.start+(R.pull-R.c0)/R.lv.cps,0.35,0.12,'bandpass',900,2,{to:4000});
  },
  preStep(R,t){R.curF=clamp(R.c0+(t-R.start)*R.lv.cps,R.c0,R.dec);R.cur=Math.floor(R.curF);hTapeFill(R);},
  onAnswer(R){const S0={pitchMid:R.path[R.dec],pitchStep:Math.max(0.5,MED_RANGE/8)};
    for(const tr of R.trades){if(tr.c<=R.dec)continue;const t=R.revStart+0.4+(tr.c-R.dec)/34,v=tr.b+tr.s;if(v<20)continue;const side=tr.b>=tr.s?1:-1;INST.pluck(t,priceMidi(S0,tr.p,side),0.04);}},
  postStep(R,t){R.curF=Math.min(R.cEnd,R.dec+Math.max(0,t-R.revStart-0.4)*34);R.cur=Math.floor(R.curF);hTapeFill(R);return R.cur>=R.cEnd&&t>R.revStart+0.4+R.postDur+0.3;},

function hTapeFill(R){while((R.tapeIdx||0)<R.trades.length&&R.trades[R.tapeIdx||0].c<=R.cur){const tr=R.trades[R.tapeIdx||0];R.tapeIdx=(R.tapeIdx||0)+1;

function heatPanel(R,t,x,y,w,h){

// ── indicators: EMA 9/20/50/200, Bollinger Bands (20, 2), RSI 14 ─────────
// Calculated on 1-minute closes (one minute = 24 columns), seeded with the earlier real candles of the
// same day, and updated live inside the current minute. Toggled from the chips on screen or in Settings.
const IND_KEYS=[['e9','EMA 9','#ff9944'],['e20','EMA 20','#4ea1ff'],['e50','EMA 50','#ff4fa3'],['e200','EMA 200','#f5d142'],['bb','BB 20·2','#b8c4ff'],['rsi','RSI 14','#c792ff']];
const IND=Object.assign({e9:false,e20:false,e50:false,e200:false,bb:false,rsi:false},store.get('ow_ind',{}));
function toggleInd(k){IND[k]=!IND[k];store.set('ow_ind',IND);}
function ensureInd(R){
  if(R.ind)return R.ind;
  const out={e9:[],e20:[],e50:[],e200:[],bbM:[],bbU:[],bbL:[],rsi:[]},closes=[];
  for(let j=Math.max(0,R.k0-45);j<R.k0;j++){const [o,h,l,c]=R.day.c[j],bull=c>=o,e1=bull?l:h,e2=bull?h:l;closes.push(o+(e1-o)*0.7,e1,(e1+e2)/2,e2,c);}
  if(!closes.length)closes.push(R.path[0]);
  const A={9:2/10,20:2/21,50:2/51,200:2/201},ema={};for(const n in A){let v=closes[0];for(const x of closes)v+=(x-v)*A[n];ema[n]=v;}
  let ag=0,al=0;{const d=[];for(let i=1;i<closes.length;i++)d.push(closes[i]-closes[i-1]);const f=d.slice(0,14);ag=f.reduce((s,x)=>s+Math.max(x,0),0)/Math.max(1,f.length);al=f.reduce((s,x)=>s+Math.max(-x,0),0)/Math.max(1,f.length);for(const x of d.slice(14)){ag=(ag*13+Math.max(x,0))/14;al=(al*13+Math.max(-x,0))/14;}}
  let last=closes[closes.length-1];
  for(let c=0;c<=R.cEnd;c++){
    const p=R.path[c];
    for(const n in A)out['e'+n][c]=ema[n]+(p-ema[n])*A[n];
    const d=p-last,g2=(ag*13+Math.max(d,0))/14,l2=(al*13+Math.max(-d,0))/14;out.rsi[c]=l2===0?100:100-100/(1+g2/l2);
    const win=closes.slice(-19).concat([p]),m=win.reduce((s,x)=>s+x,0)/win.length,sd=Math.sqrt(win.reduce((s,x)=>s+(x-m)*(x-m),0)/win.length);
    out.bbM[c]=m;out.bbU[c]=m+2*sd;out.bbL[c]=m-2*sd;
    if(c%24===23){for(const n in A)ema[n]=out['e'+n][c];ag=g2;al=l2;last=p;closes.push(p);}
  }
  R.ind=out;return out;
}
function drawOverlays(R,X,Y,c1,c2){
  if(!IND.e9&&!IND.e20&&!IND.e50&&!IND.e200&&!IND.bb)return;const I=ensureInd(R);
  const line=(arr,col,w,dash)=>{cx.strokeStyle=col;cx.lineWidth=w;if(dash)cx.setLineDash(dash);cx.beginPath();for(let c=c1;c<=c2;c++){const xx=X(c),yy=Y(arr[c]);c===c1?cx.moveTo(xx,yy):cx.lineTo(xx,yy);}cx.stroke();cx.setLineDash([]);cx.lineWidth=1;};
  if(IND.bb){cx.fillStyle='rgba(184,196,255,0.06)';cx.beginPath();for(let c=c1;c<=c2;c++){const xx=X(c);c===c1?cx.moveTo(xx,Y(I.bbU[c])):cx.lineTo(xx,Y(I.bbU[c]));}for(let c=c2;c>=c1;c--)cx.lineTo(X(c),Y(I.bbL[c]));cx.closePath();cx.fill();
    line(I.bbU,'rgba(184,196,255,0.75)',1.2);line(I.bbL,'rgba(184,196,255,0.75)',1.2);line(I.bbM,'rgba(184,196,255,0.45)',1,[4,4]);}
  for(const [k,,col] of IND_KEYS.slice(0,4))if(IND[k])line(I[k],col,1.8);
}
function indLegend(x,y){let xx=x;cx.font='800 10px system-ui,Arial';cx.textAlign='left';for(const [k,lab,col] of IND_KEYS){if(!IND[k]||k==='rsi')continue;cx.fillStyle=col;cx.fillText(lab,xx,y);xx+=cx.measureText(lab).width+12;}}
function cvdPanel(R,x,y,w,h,c1,X){
  cx.fillStyle='#0a0c16';rr(x,y,w,h,10);cx.fill();txt('CVD',x+8,y+14,'800 10px system-ui,Arial','#6f7596');
  let cum=0,lo=0,hi=0;const pts=[];for(const tr of R.trades){if(tr.c>R.cur)break;cum+=tr.b-tr.s;if(tr.c>=c1){pts.push([tr.c,cum]);lo=Math.min(lo,cum);hi=Math.max(hi,cum);}}
  const sp=Math.max(1,hi-lo),CY=v=>y+h-6-(v-lo)/sp*(h-20),XX=X||(c=>x+8+(c-c1)/Math.max(1,R.cur-c1)*(w-80));
  cx.strokeStyle='rgba(255,255,255,0.12)';cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(x,CY(0));cx.lineTo(x+w-70,CY(0));cx.stroke();cx.setLineDash([]);
  cx.strokeStyle='#ff6a4d';cx.lineWidth=2;cx.beginPath();pts.forEach(([c,v],i)=>{i?cx.lineTo(XX(c),CY(v)):cx.moveTo(XX(c),CY(v));});cx.stroke();cx.lineWidth=1;
  txt((cum>=0?'+':'')+cum,x+w-8,y+h/2+5,'900 14px ui-monospace,Menlo,Consolas,monospace',cum>=0?'#35e08f':'#ff6a4d','right');
}
function rsiPanel(R,x,y,w,h,c1,X){
  const I=ensureInd(R);cx.fillStyle='#0a0c16';rr(x,y,w,h,10);cx.fill();txt('RSI 14',x+8,y+14,'800 10px system-ui,Arial','#c792ff');

  cx.strokeStyle='rgba(255,255,255,0.12)';cx.setLineDash([3,3]);for(const v of [30,70]){cx.beginPath();cx.moveTo(x,RY(v));cx.lineTo(x+w-70,RY(v));cx.stroke();}cx.setLineDash([]);
  cx.strokeStyle='#c792ff';cx.lineWidth=1.8;cx.beginPath();for(let c=c1;c<=R.cur;c++){const xx=XX(c),yy=RY(I.rsi[c]);c===c1?cx.moveTo(xx,yy):cx.lineTo(xx,yy);}cx.stroke();cx.lineWidth=1;
  const v=I.rsi[R.cur];txt(v.toFixed(1),x+w-8,y+h/2+5,'900 14px ui-monospace,Menlo,Consolas,monospace',v>70?'#ff6a8a':v<30?'#35e08f':'#c792ff','right');
}

function classifyTrade(R,t){

    const d=Math.abs(t.c0-e.dec)+dp/near*20;if(d<bd){bd=d;best=e;}}

  if(!e)s='No planted setup near this entry. What in the book told you to take it? Trades without a clear reason are the first ones to cut.';
  else{const ok=t.aligned,agg=e.dir>0?'sellers':'buyers',side=e.dir>0?'bid':'offer',early=t.c0<e.dec-2;
    switch(evKey(e)){
      case 'hold':s=ok?(early?'You '+did+' ahead of the '+side+' wall at '+L+' and it held. Good read, though waiting for the first test is safer.':'You '+did+' off the '+side+' wall at '+L+' after it held the test. Good read.')
        :'You '+did+' into a '+side+' wall at '+L+' that held. Size was resting there and absorbed every hit. Don\'t press into a wall that is not shrinking.';break;
      case 'iceberg':s=ok?'You traded the bounce off a hidden, refilling order at '+L+'. Good read: big '+agg+' kept hitting one price and it never broke.'
        :'You '+did+' into an iceberg at '+L+'. Big '+agg+' kept hitting it, the size kept coming back and price would not go through. When a price eats volume without moving, stop pressing into it.';break;
      case 'spoof':s=ok?(t.c0>=e.pull?'You '+(t.side>0?'bought':'shorted')+' right after the wall at '+L+' was pulled. Good read: it was a spoof.':'You traded the break before the wall at '+L+' was pulled. Right this time, but it was a guess: wait for the pull.')
        :(t.c0<e.pull?'You leaned on the wall at '+L+' and it was pulled before price got there: a spoof. Trust a bright wall only once it has been tested.':'You traded against the break after the wall at '+L+' had already been pulled. A pulled wall means the way is open.');break;
      case 'thin':s=ok?'Empty book ahead and aggressive orders pushing: you went with it. Good read.':'You faded a move into an empty book near '+L+'. Nothing was resting there to stop it.';break;
      case 'eaten':s=ok?'The wall at '+L+' shrank with every hit and you traded the break. Good read.':'You leaned on the wall at '+L+' while it was being eaten, smaller with every hit. A shrinking wall is about to break.';break;
      case 'stoprun':s=ok?'You faded the stop run: the burst through the old '+(e.dir>0?'low':'high')+' at '+L+' was stops firing, it got absorbed and price snapped back. Great read.'

function update(){
  if(MODE!=='play'||!G||!G.round)return;const R=G.round,t=now();

    if(G.demo){R.revStart=t+0.1;G.scene.onAnswer(R);}}}
  else if(R.phase==='demo'){G.scene.postStep(R,t);}
  else if(R.phase==='ask'){const left=G.lv.ask-(t-R.askStart);const sec=Math.ceil(left);if(sec!==R.lastSec&&sec<=3&&sec>0){R.lastSec=sec;INST.tick(t,sec===1?88:81,1);}if(left<=0)answer(null);}

function parseCSV(text){

  if(tf<60||tf>3600)throw new Error('The candles are '+Math.round(tf/60)+' minutes apart. Export 1- to 15-minute candles (5 minutes works best).');

  const px=[...new Set(R2.slice(-3000).flatMap(r=>[r[1],r[2],r[3],r[4]]))].sort((a,b)=>a-b);let mn=Infinity;for(let i=1;i<px.length;i++){const d=px[i]-px[i-1];if(d>1e-9&&d<mn)mn=d;}

  // sessions: runs of consecutive candles cut into pieces of 78 (the length of one NQ day)
  const S=[];let run=[R2[0]];const flush=()=>{for(let i=0;i+78<=run.length;i+=78){const ch=run.slice(i,i+78),d0=new Date(ch[0][0]*1000);
    S.push({d:d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0'),w:d0.toLocaleDateString('en-US',{weekday:'short'}),t0:d0.getHours()*3600+d0.getMinutes()*60+d0.getSeconds(),tf,c:ch.map(r=>[r[1],r[2],r[3],r[4],r[5]])});}};
  for(let i=1;i<R2.length;i++){if(R2[i][0]-R2[i-1][0]>tf*1.5){flush();run=[];}run.push(R2[i]);}flush();
  if(S.length<3)throw new Error('Only '+S.length+' full sessions of 78 candles in a row. Export a longer history (at least a few days).');
  return {sessions:S.slice(-120),tf,tick,n:R2.length,first:R2[0][0],last:R2[R2.length-1][0],hasVol:R2.some(r=>r[5]>0)};
}
function showData(back){
  const D=store.get('ow_data',null);let parsed=null;
  sheet('<div class="kick">MARKET DATA</div><h2>📈 Play on your own market</h2>'+
    '<p>Export candles from TradingView (chart → ⋯ → <b>Export chart data</b>, ISO or UNIX time) and load the CSV here. <b>5-minute candles</b> work best; 1 to 15 minutes are accepted. Every chapter then replays your market: the price path is your real data, the order flow is simulated around it, exactly like the built-in NQ.</p>'+
    '<div class="rule small">Now playing: <b>'+esc(INSTR.name)+'</b> · '+SESSIONS.length+' sessions · '+esc(INSTR.lot)+' at '+fmt$(INSTR.pval)+'/point · tick '+INSTR.tick+(INSTR.custom?' · <a href="#" id="nqBtn" style="color:#38d6d6">switch back to the built-in NQ</a>':'')+'</div>'+
    '<div class="set"><span class="lbl">INSTRUMENT</span><select id="psIn">'+Object.keys(PRESETS).map(k=>'<option>'+k+'</option>').join('')+'<option value="custom">Other…</option></select></div>'+
    '<div class="set fields"><label>Symbol <input id="fSym" size="6"></label><label>Lot <input id="fLot" size="8"></label><label>Tick size <input id="fTick" size="6"></label><label>$ per point per lot <input id="fPv" size="6"></label><label>Fee per lot per side $ <input id="fFee" size="5"></label></div>'+
    '<div class="set"><span class="lbl">CSV FILE</span><input type="file" id="fileIn" accept=".csv,.txt,text/csv"></div><div id="dataMsg" class="hint"></div>'+
    '<div class="actions"><button type="button" class="cta" id="useBtn" disabled>USE THIS DATA ▶</button><button type="button" class="ghost" id="backBtn">Back</button></div>'+
    '<div class="disc">The file stays on this device (saved in your browser) and the page reloads to switch markets. Your stars, achievements and journal are kept; journal trades are tagged by symbol.</div>',true);
  const fill=k=>{const p=PRESETS[k];if(!p)return;$('fSym').value=p.sym;$('fLot').value=p.lot;$('fTick').value=p.tick;$('fPv').value=p.pval;$('fFee').value=p.fee;};
  fill('BTC');$('psIn').onchange=e=>{fill(e.target.value);if(e.target.value==='custom'&&parsed)$('fTick').value=parsed.tick;};
  $('backBtn').onclick=back||showMenu;const nq=$('nqBtn');if(nq)nq.onclick=e=>{e.preventDefault();try{localStorage.removeItem('ow_data');}catch(err){}store.set('ow_skip',true);location.reload();};
  $('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{parsed=parseCSV(String(rd.result));
      const d=x=>new Date(x*1000).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      $('dataMsg').innerHTML='✓ '+parsed.n.toLocaleString('en-US')+' candles, '+Math.round(parsed.tf/60)+'-minute, '+d(parsed.first)+' – '+d(parsed.last)+' → <b>'+parsed.sessions.length+' sessions</b> of 78 candles. Smallest price step '+parsed.tick+'.'+(parsed.hasVol?'':' No volume column: sizes will follow the candle ranges.');
      $('dataMsg').style.color='#2ee6a0';$('useBtn').disabled=false;
      if($('psIn').value==='custom')$('fTick').value=parsed.tick;}
    catch(err){parsed=null;$('dataMsg').textContent='✗ '+err.message;$('dataMsg').style.color='#ff4d6d';$('useBtn').disabled=true;}};rd.readAsText(f);};
  $('useBtn').onclick=()=>{if(!parsed)return;const tick=+$('fTick').value,pval=+$('fPv').value,fee=+$('fFee').value,sym=($('fSym').value||'MKT').trim().slice(0,10);
    if(!(tick>0)||!(pval>0)||!(fee>=0)){$('dataMsg').textContent='✗ Tick size and $ per point must be positive numbers.';$('dataMsg').style.color='#ff4d6d';return;}
    const fn=($('fileIn').files[0]||{}).name||'your CSV',pre=PRESETS[$('psIn').value];
    let ss=parsed.sessions;const save=()=>{store.set('ow_data',{sym,name:pre&&pre.sym===sym?pre.name:sym,lot:($('fLot').value||sym).trim().slice(0,12),tick,pval,fee,src:fn+', '+ss.length+' sessions',sessions:ss});const g=store.get('ow_data',null);return g&&g.sessions&&g.sessions.length===ss.length;};
    while(!save()&&ss.length>6)ss=ss.slice(Math.floor(ss.length/2));
    if(!store.get('ow_data',null)){$('dataMsg').textContent='✗ Not enough browser storage for this file.';return;}
    store.set('ow_skip',true);location.reload();};
}

// ── boot: landing page first ──────────────────────────────────────────────
showMenu();
(function splash(){
  const sp=$('splash');if(!sp)return;let phase='gate';
  if(store.get('ow_skip',false)){store.set('ow_skip',false);sp.remove();return;}
  const finish=()=>{phase='after';$('spAfter').classList.add('show');$('enterBtn').focus();};
  const go=e=>{if(!sp.isConnected){window.removeEventListener('keydown',go,true);return;}if(e){e.preventDefault();e.stopPropagation();}
    if(phase==='gate'){phase='intro';$('gate').classList.add('hide');const ac=audio();if(ac&&ac.state==='suspended')ac.resume();if(INTRO)INTRO.start(finish);else finish();return;}
    if(phase==='intro'){if(INTRO)INTRO.skip();return;}
    if(phase==='after'){phase='gone';sp.classList.add('out');window.removeEventListener('keydown',go,true);
      setTimeout(()=>{sp.remove();const f=$('sheet').querySelector('[data-focus]');if(f)f.focus();},650);}};
  sp.addEventListener('click',go);window.addEventListener('keydown',go,true);$('gateBtn').focus();
})();
requestAnimationFrame(frame);
