<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meme Pump</title>
<style>
:root{--bg:#09090f;--p1:#12121d;--p2:#191928;--p3:#20203a;--ln:#2a2a46;--ln2:#3a3a64;--tx:#f3f1ff;--sub:#a9a6c8;--dim:#6f6c94;
  --up:#3dff8f;--dn:#ff4d6d;--gold:#ffe14d;--pink:#ff4fd8;--cyan:#4de1ff;--org:#ff9d3d;--hunt:#3dff8f;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 var(--ui);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
input{font:inherit;color:var(--tx)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:linear-gradient(180deg,#14142a,#0e0e1a);border-bottom:1px solid var(--ln);min-height:54px;flex-wrap:wrap}
.tlogo{font:900 20px/1 var(--ui);letter-spacing:.04em;white-space:nowrap}.tlogo b{background:linear-gradient(90deg,var(--up),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tstat{display:flex;flex-direction:column;line-height:1.1}.tstat .k{font:800 9px/1 var(--ui);letter-spacing:.14em;color:var(--dim)}.tstat .v{font:900 17px/1.2 var(--mono)}
.tsp{flex:1}
.tbtn{background:var(--p2);border:1px solid var(--ln2);border-radius:10px;padding:8px 12px;font:800 12px/1 var(--ui)}
.tbtn:hover{border-color:var(--pink)}
.goal{width:150px;height:8px;border-radius:5px;background:var(--p3);overflow:hidden}.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--up),var(--gold));width:0}
main{flex:1;min-height:0;display:grid;gap:10px;padding:10px}
main[hidden]{display:none!important}
#spec{grid-template-columns:280px minmax(0,1fr) 320px}
#dev{grid-template-columns:300px minmax(0,1fr) 320px}
.pan{background:var(--p1);border:1px solid var(--ln);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);font:900 12px/1 var(--ui);letter-spacing:.12em;color:var(--sub)}
.ph .sp{flex:1}
.tabs button{padding:5px 9px;border-radius:8px;font:800 11px/1 var(--ui);color:var(--dim)}.tabs button.on{background:var(--p3);color:var(--tx)}
.scroll{overflow:auto;min-height:0;flex:1}
/* feed */
#feedList{padding:6px;display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:8px;position:relative;width:100%}
.card:hover{border-color:var(--ln2)}.card.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.card.dead{opacity:.45}.card.new{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.9);background:#2b1f4d}to{transform:none}}
.mas{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;line-height:1}
.cn b{font:900 13px/1.1 var(--ui);display:block}.cn span{font:11px/1.2 var(--ui);color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.cr{text-align:right}.cr b{font:900 13px/1.1 var(--mono);display:block}.cr span{font:800 11px/1.2 var(--mono)}
.card svg{position:absolute;right:8px;bottom:4px;width:64px;height:16px;opacity:.6;pointer-events:none}
.bdg{position:absolute;top:-6px;left:6px;font:900 9px/1 var(--ui);letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--p3);border:1px solid var(--ln2)}
.up{color:var(--up)}.dn{color:var(--dn)}.gd{color:var(--gold)}.pk{color:var(--pink)}.cy{color:var(--cyan)}.dm{color:var(--dim)}
/* center */
.center{display:flex;flex-direction:column;gap:10px;min-height:0}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--p1);border:1px solid var(--ln);border-radius:14px}
.chead .mas{width:52px;height:52px;font-size:32px;border-radius:14px}
.chead>div{min-width:0;flex:1}.chead h2{margin:0;font:900 20px/1.1 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead .nm{font:12px/1.3 var(--ui);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead .big{flex:none!important;white-space:nowrap}
.chead .big{margin-left:auto;text-align:right}.chead .big b{font:900 26px/1 var(--mono);display:block}.chead .big span{font:800 12px/1.4 var(--mono)}
.chartbox{position:relative;flex:1;min-height:220px;background:var(--p1);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;left:0;right:0;top:38%;text-align:center;font:900 clamp(30px,6vw,64px)/1 var(--ui);letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .2s;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.flash.on{opacity:1;animation:shk .4s}
@keyframes shk{0%,100%{transform:none}25%{transform:translate(-6px,2px) rotate(-1deg)}75%{transform:translate(6px,-2px) rotate(1deg)}}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.tb h4{margin:0 0 8px;font:900 11px/1 var(--ui);letter-spacing:.14em;color:var(--sub);display:flex;gap:8px}.tb h4 span{margin-left:auto;color:var(--tx);font-family:var(--mono);letter-spacing:0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.bb{flex:1;min-width:58px;padding:11px 6px;border-radius:10px;font:900 13px/1 var(--ui);background:#123d27;color:var(--up);border:1px solid #1f6b43}
.bb:hover{background:#185234}.bb:disabled{opacity:.35;cursor:not-allowed}
.sb{background:#43141f;color:var(--dn);border-color:#7a2236}.sb:hover{background:#5a1a29}
.posl{font:800 12px/1.5 var(--mono);color:var(--sub);margin-top:8px;min-height:18px}
.bags{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-height:34px}
.chip{flex:none;display:flex;gap:6px;align-items:center;background:var(--p1);border:1px solid var(--ln);border-radius:999px;padding:6px 10px;font:800 12px/1 var(--mono)}
.chip.sel{border-color:var(--pink)}
/* side */
.info{padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font:12px/1.35 var(--ui);border-bottom:1px solid var(--ln)}
.info .k{color:var(--sub)}.info .v{font:800 12px/1.35 var(--mono);text-align:right}
.info .lk{color:var(--dim);font-family:var(--ui);font-weight:700}
#chat,#dchat{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font:12px/1.35 var(--ui)}
.msg{animation:fin .25s ease}.msg u{text-decoration:none;font-weight:800}.msg.sys{font-weight:800;padding:4px 8px;border-radius:8px;background:var(--p2)}
.msg.alpha{background:#24123d;border:1px solid #5d2fa3;padding:6px 8px;border-radius:8px;font-weight:800}
@keyframes fin{from{opacity:0;transform:translateY(4px)}}
/* dev */
.acts{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{position:relative;text-align:left;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 9px 11px;overflow:hidden}
.act:hover:not(:disabled){border-color:var(--ln2)}.act:disabled{opacity:.4;cursor:not-allowed}
.act b{display:block;font:900 12.5px/1.2 var(--ui)}.act span{display:block;font:11px/1.3 var(--ui);color:var(--sub);margin-top:2px}.act em{display:block;font:800 11px/1 var(--mono);font-style:normal;color:var(--gold);margin-top:5px}
.act i{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);width:0}
.act.evil{border-color:#5a1a29;background:#1e0f16}.act.evil b{color:var(--dn)}
.act.good b{color:var(--up)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.meter .k{font:900 10px/1 var(--ui);letter-spacing:.14em;color:var(--sub);display:flex}.meter .k span{margin-left:auto;font-family:var(--mono);color:var(--tx)}
.bar{height:10px;border-radius:6px;background:var(--p3);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;transition:width .25s}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* overlay */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(60,20,90,.55),rgba(5,4,16,.88));backdrop-filter:blur(3px)}
.ov[hidden]{display:none!important}
.sheet{width:min(980px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(26,22,52,.98),rgba(14,12,30,.98));border:1px solid var(--ln2);border-radius:20px;padding:24px 26px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.sheet.narrow{width:min(620px,100%)}
.kick{font:800 12px/1 var(--ui);letter-spacing:.26em;color:var(--pink)}
.logo{font:900 clamp(48px,9vw,96px)/.95 var(--ui);letter-spacing:.04em;margin:8px 0 6px}
.logo b{background:linear-gradient(90deg,var(--up),var(--gold) 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font:600 17px/1.45 var(--ui);color:#ddd8ff}
.sheet h2{font:900 30px/1.15 var(--ui);margin:8px 0}.sheet h3{font:900 15px/1.2 var(--ui);margin:18px 0 8px;color:#ddd8ff}
.sheet p{color:var(--sub);margin:8px 0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:18px 0 4px}
.mode{text-align:left;background:var(--p2);border:2px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--pink);transform:translateY(-2px)}
.mode .mi{font-size:34px;line-height:1}.mode b{font:900 22px/1.2 var(--ui)}.mode span{font:13px/1.45 var(--ui);color:var(--sub)}
.mode em{margin-top:auto;font:800 12px/1.3 var(--mono);font-style:normal;color:var(--gold)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tool{text-align:left;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.tool b{font:900 13px/1.2 var(--ui);display:block}.tool span{font:12px/1.35 var(--ui);color:var(--sub);display:block;margin-top:3px}.tool em{font:800 11px/1 var(--mono);font-style:normal;display:block;margin-top:6px}
.tool.own{border-color:#1f6b43;background:#0f2a1c}.tool.own em{color:var(--up)}.tool.lock em{color:var(--dim)}
.cta{background:linear-gradient(90deg,var(--up),var(--gold));color:#111;border:0;border-radius:14px;padding:14px 26px;font:900 15px/1 var(--ui);letter-spacing:.08em;box-shadow:0 8px 30px rgba(61,255,143,.25)}
.cta:hover{filter:brightness(1.08)}.cta.red{background:linear-gradient(90deg,var(--dn),var(--pink));color:#fff}
.ghost{background:transparent;border:1px solid var(--ln2);border-radius:14px;padding:12px 16px;font:700 13px/1 var(--ui)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.disc{margin-top:16px;padding:10px 12px;border-radius:10px;background:rgba(255,225,77,.07);border:1px solid rgba(255,225,77,.3);font:12px/1.5 var(--ui);color:#eedc9a}
.hint{font:13px/1.5 var(--ui);color:var(--dim)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.how>div{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px}.how b{font:900 15px/1.2 var(--ui)}.how p{font-size:13px}
.big{font:900 64px/1 var(--mono);margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kv{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.kv .k{font:800 10px/1 var(--ui);letter-spacing:.12em;color:var(--dim)}.kv .v{font:900 20px/1.2 var(--mono);margin-top:4px}
.banner{margin:8px 0;padding:10px 14px;border-radius:12px;background:#2a2108;border:1px solid #7a5d12;color:#ffe2a0;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}.fld label{font:900 11px/1 var(--ui);letter-spacing:.12em;color:var(--sub)}
.fld input[type=text]{background:var(--p2);border:1px solid var(--ln2);border-radius:10px;padding:11px 12px;font:800 15px/1 var(--ui)}
.row{display:flex;gap:6px;align-items:center}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo button{width:44px;height:44px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font-size:24px}.emo button.on{border-color:var(--pink);background:#2a1640}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{text-align:left;background:var(--p2);border:2px solid var(--ln);border-radius:12px;padding:10px}.opt.on{border-color:var(--cyan);background:#0f2530}
.opt b{font:900 13px/1.2 var(--ui);display:block}.opt span{font:11.5px/1.35 var(--ui);color:var(--sub);display:block;margin-top:3px}
input[type=range]{width:100%;accent-color:var(--pink)}
.tog{display:flex;gap:10px;align-items:flex-start;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;cursor:pointer}
.tog input{width:18px;height:18px;margin-top:2px;accent-color:var(--pink)}.tog b{font:900 13px/1.2 var(--ui);display:block}.tog span{font:12px/1.35 var(--ui);color:var(--sub)}
.evt{font-size:44px;line-height:1}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{text-align:left;background:var(--p2);border:1px solid var(--ln2);border-radius:12px;padding:12px 14px}.choice:hover{border-color:var(--pink)}
.choice b{font:900 14px/1.2 var(--ui);display:block}.choice span{font:12px/1.4 var(--ui);color:var(--sub);display:block;margin-top:3px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast div{background:#1d1a38;border:1px solid var(--ln2);border-radius:12px;padding:9px 14px;font:800 13px/1.2 var(--ui);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fin .2s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25}
@media (max-width:1100px){#spec{grid-template-columns:240px minmax(0,1fr) 280px}#dev{grid-template-columns:260px minmax(0,1fr) 270px}}
@media (max-width:900px){
  body{overflow:auto}#app{position:static;min-height:100%}
  main{display:flex!important;flex-direction:column}main[hidden]{display:none!important}
  #feedPan{max-height:none}#feedList{flex-direction:row;overflow-x:auto}#feedList .card{min-width:200px}
  .chartbox{min-height:300px;flex:none;height:46vh}.side{max-height:420px}
  .goal{width:80px}.tlogo{font-size:16px}#top{gap:10px}
  .dstats{grid-template-columns:repeat(2,1fr)}#dev .center{order:-1}.form{grid-template-columns:1fr}
}
@media (max-width:520px){.goal,.tstat:has(.goal){display:none}#cashOut{padding:8px}.chartbox{height:38vh;min-height:260px}.chead{gap:10px;padding:10px}.chead>div{min-width:0}.chead h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead .big span{display:block}.chead .mas{width:42px;height:42px;font-size:26px}.tlogo{font-size:14px}.trade{grid-template-columns:1fr}.meters{grid-template-columns:1fr}.chead .big b{font-size:20px}.tstat .v{font-size:14px}}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .4s}
.gate.hide{opacity:0;pointer-events:none}
#gateBtn{background:transparent;border:1px solid rgba(160,112,240,.6);color:#d9ccff;border-radius:999px;padding:14px 28px;font:800 13px/1 var(--ui);letter-spacing:.24em;animation:pulse 2.2s ease-in-out infinite}
#gateBtn:hover{background:rgba(160,112,240,.12)}
.gate .g2{font:12px/1.4 var(--ui);color:#7d82a8}
.sp-after{position:absolute;left:0;right:0;top:52%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 16px;opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.sp-after.show{opacity:1;transform:none;pointer-events:auto}
.sp-after .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:0 0 14px;padding-left:.6em}
.sp-after .sp-title{font:900 clamp(46px,9vw,96px)/0.95 var(--ui);letter-spacing:.1em;padding-left:.1em;color:#eef3ff;text-shadow:0 8px 40px rgba(255,90,200,.3)}
.sp-after .sp-title b{color:var(--hunt)}
.sp-after .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance}
.sp-after #enterBtn{opacity:1;animation:pulse 2.2s ease-in-out 1s infinite}
@media (max-height:620px){.sp-after{top:48%}.sp-after .presents{margin-bottom:6px}}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(90deg,#0a0e20 0%,#11102a 50%,#171133 100%);transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .grid{position:absolute;left:-50%;right:-50%;bottom:-2px;height:42vh;transform:perspective(320px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(56,214,214,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(150,110,255,.5) 1px,transparent 1px);background-size:46px 46px;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%);animation:gridmove 3.2s linear infinite}
@keyframes gridmove{to{background-position:0 46px,0 0}}
#splash .glow{position:absolute;left:50%;bottom:30vh;width:70vmin;height:70vmin;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle,rgba(255,150,80,.16),rgba(167,108,255,.08) 45%,transparent 70%);pointer-events:none}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:100%}
.sp-in .fvg{width:min(640px,86vw);height:auto;display:block;filter:drop-shadow(0 10px 40px rgba(120,90,255,.25));opacity:0;animation:spIn 1s ease .1s forwards}
.sp-in .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:26px 0 14px;padding-left:.6em;opacity:0;animation:spIn .8s ease .9s forwards}
.sp-in .sp-title{font:900 clamp(46px,9vw,96px)/0.95 var(--ui);letter-spacing:.1em;padding-left:.1em;color:#e8ecf1;text-shadow:0 0 40px rgba(255,107,44,.25);opacity:0;animation:spIn .9s ease 1.3s forwards}
.sp-in .sp-title b{color:var(--hunt)}
.sp-in .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance;opacity:0;animation:spIn .8s ease 1.7s forwards}
#enterBtn{margin-top:30px;background:transparent;border:1px solid rgba(47,211,138,.6);color:#9ff5c8;border-radius:999px;padding:13px 26px;font:800 12px/1 var(--ui);letter-spacing:.22em;opacity:0;animation:spIn .8s ease 2.1s forwards,pulse 2.2s ease-in-out 3s infinite}
#enterBtn:hover{background:rgba(255,107,44,.12);border-color:var(--hunt)}
.sp-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:11px/1.5 var(--ui);color:#6d7396;padding:0 16px}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,44,0)}50%{box-shadow:0 0 0 6px rgba(255,107,44,.12)}}
@media (prefers-reduced-motion:reduce){#splash .grid{animation:none}.sp-in *,#enterBtn{animation:none!important;opacity:1!important}}

.gate{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .4s}
.gate.hide{opacity:0;pointer-events:none}

// ── the pool: a constant-product bonding curve (USD reserve R, token reserve K/R) ──
function newPool(c,M){c.R=Math.sqrt(M*K/SUPPLY);c.mcap=M;}
const mcOf=R0=>R0*R0/K*SUPPLY;
function moveLn(c,d){c.R=Math.max(20,c.R*Math.exp(d/2));c.mcap=mcOf(c.R);}
function poolBuy(c,usd){const Tr=K/c.R;c.R+=usd;c.mcap=mcOf(c.R);return Tr-K/c.R;}
function poolSell(c,q){const Tr=K/c.R,R1=K/(Tr+q),usd=c.R-R1;c.R=Math.max(20,R1);c.mcap=mcOf(c.R);return usd;}
function sellQuote(c,q){if(q<=0)return 0;const Tr=K/c.R;return c.R-K/(Tr+q);}

    case 'slow':if(a<c.tR){mu=c.r;}else{mu=-0.03;sg=0.08;}break;
    case 'honey':if(a<c.tR){mu=c.r;sg=0.035;}else if(!c.dumped){dumpNow(c,0.97,quiet);}else mu=-0.01;break;
    default:if(a<c.tR){mu=c.r;sg=0.1;}else{mu=-0.022;sg=0.08;}
  }
  if(a<3&&!c.rugged){mu+=0.3;sg+=0.1;}
  if(a>150&&!c.rugged)mu-=0.015;

  if(!c.rugged&&mu>0.02&&a>3&&chance(dt*0.07)){if(chance(0.6)){const j=rnd(0.08,0.3);moveLn(c,Math.log(1+j));if(!quiet)sys(c,'🐋 whale bought '+rnd(3,40).toFixed(1)+' SOL');}else{moveLn(c,Math.log(1-rnd(0.12,0.28)));if(!quiet)sys(c,'🔻 big sell: '+rnd(2,15).toFixed(1)+' SOL');}}
  if(c.type==='runner'&&!c.kol&&a>c.T1*0.4&&chance(dt*0.03)){c.kol=1;kol(c,quiet);}
  moveLn(c,mu*dt+sg*Math.sqrt(dt)*gauss());
  tick(c);
  if(!c.grad&&c.mcap>=GRAD&&!c.rugged){if(c.type==='rug'){rugNow(c,quiet);}else{c.grad=true;c.lp='burned';if(!quiet){sys(c,'🎓 GRADUATED to Raydoom! Liquidity burned.');if(c===S.sel){flash('flash','🎓 GRADUATED','#ffe14d');SFX.grad();}}}}
  if(!c.dead&&a>15&&c.mcap<1500){c.deadT=(c.deadT||0)+dt;if(c.deadT>4){c.dead=true;c.deadAt=S.t;if(!quiet)sys(c,'☠ This coin is dead.');}}

}

function chatFor(c,dt){

  else if(mom>0.02)k=c.type==='runner'&&c.age>c.T1*0.6&&chance(0.4)?'runner':'pump';else if(mom<-0.02)k=c.dumped?'dumpd':'dip';
  const rate=c.dead||c.rugged?0.15:0.5+Math.min(3,Math.abs(mom)*20)+(c.age<6?1.5:0);

function specStep(dt){

    // momentum (10 s change) for chat and the feed
    c.hist.push(c.mcap);if(c.hist.length>100)c.hist.shift();c.mom=Math.log(c.mcap/c.hist[0])/10;
    if(c===S.sel||S.pos[c.id])chatFor(c,dt);}
  // positions: auto take-profit, milestones
  for(const id in S.pos){const p=S.pos[id],c=p.c;if(p.q<=0)continue;const v=valueOf(p),x=v/p.cost;
    if(has('tp')&&!p.tp&&x>=2&&c.type!=='honey'){p.tp=1;sell(c,0.5,true);toast('🎯 Auto take-profit: sold half of $'+esc(c.ticker)+' at 2×','#3dff8f');}
    for(const m of [2,5,10,25,50,100,500,1000])if(x>=m&&!(p.ms||(p.ms=[])).includes(m)){p.ms.push(m);if(m>=5){toast('🚀 <b>'+m+'×</b> on $'+esc(c.ticker)+'!','#3dff8f');SFX.milestone();if(m>=10)confetti(m>=100?220:120);}}}
  // alpha calls
  if(has('alpha')){S.alphaT-=dt;if(S.alphaT<=0){S.alphaT=rnd(30,50);const fresh=S.coins.filter(c=>c.age<10&&!c.rugged);
    const good=fresh.find(c=>c.type==='runner'),bad=fresh.find(c=>c.type==='dump'||c.type==='rug');const c=chance(0.65)?(good||bad):(bad||good);
    if(c){toast('👽 <b>ALPHA:</b> $'+esc(c.ticker)+' looks primed. You didn\'t hear it from me.','#9b5cff');SFX.alpha();addChat(c,{alpha:1,t:'👽 ALPHA GROUP called $'+c.ticker});c.alpha=1;}}}
  // king of the hill
  const live=S.coins.filter(c=>!c.grad&&!c.rugged&&!c.dead);S.kotH=live.length?live.reduce((a,b)=>a.mcap>b.mcap?a:b):null;
  // prune
  S.coins=S.coins.filter(c=>S.pos[c.id]&&S.pos[c.id].q>0||c===S.sel||!((c.dead||c.rugged)&&S.t-(c.deadAt||c.rugAt||S.t)>25)&&c.age<260);
  while(S.coins.length>18){const i=S.coins.map((c,j)=>[c,j]).reverse().find(([c])=>!(S.pos[c.id]&&S.pos[c.id].q>0)&&c!==S.sel);if(!i)break;S.coins.splice(i[1],1);}
  const nw=netWorth();S.peak=Math.max(S.peak,nw);
  SFX.tempo(clamp(112+(S.sel?Math.abs(S.sel.mom)*300:0),112,165),clamp(Math.abs(S.sel?S.sel.mom:0)*8,0.2,1));
  if(nw<0.02&&!Object.values(S.pos).some(p=>p.q>0&&valueOf(p)>0.005))endSpec('rekt');
  else if(nw>=1000)endSpec('win');
}

const INTRO=(()=>{

  const cv2=$('introCv');if(!cv2)return null;const g=cv2.getContext('2d');let w=0,h=0;
  function size(){const d=Math.min(1.5,window.devicePixelRatio||1);w=window.innerWidth;h=window.innerHeight;cv2.width=Math.round(w*d);cv2.height=Math.round(h*d);g.setTransform(d,0,0,d,0,0);}
  window.addEventListener('resize',size);size();
  let state='gate',t0=0,done=false,onDone=null,skipped=false;const T_END=6.6;
  const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P=[];for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,r=0.6+Math.random()*0.8;P.push({a,r,s:0.5+Math.random()*1.5,d:Math.random()*1.2,c:Math.random()<0.5?'#3cc8d0':'#a070f0'});}

    const sub=ac.createOscillator(),sg=ac.createGain();sub.type='sine';sub.frequency.value=36.7;sg.gain.setValueAtTime(0.0001,t);sg.gain.exponentialRampToValueAtTime(0.35,t+3.2);sg.gain.setValueAtTime(0.35,t+5.2);sg.gain.exponentialRampToValueAtTime(0.0001,t+8.6);sub.connect(sg);sg.connect(bus);sub.start(t);sub.stop(t+8.8);

    [1175,1480,1760,2349].forEach((f,i)=>tone(t+3.0+i*0.07,f,1.4,0.05));
    {const n=Math.floor(ac.sampleRate*1.1),bf=ac.createBuffer(1,n,ac.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
     const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gg=ac.createGain();s.buffer=bf;f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(600,t+4.55);f.frequency.exponentialRampToValueAtTime(5000,t+5.55);
     gg.gain.setValueAtTime(0.0001,t+4.55);gg.gain.exponentialRampToValueAtTime(0.07,t+5.5);gg.gain.exponentialRampToValueAtTime(0.0001,t+5.55);s.connect(f);f.connect(gg);gg.connect(dest);s.start(t+4.55);s.stop(t+5.6);}

  const LEAD=0.06;let BUF=null,SRC=null,SG=null;
  (function prerender(){try{const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)return;const sr=44100,oac=new O(2,Math.ceil(sr*9.6),sr);

    else{SG=ac.createGain();SG.connect(AU.master);build(ac,SG,t);TA=t;}   // fallback: play it live
  }
  // ── drawing ──
  function almond(a,k){g.moveTo(-a,0);g.bezierCurveTo(-a*0.5,-k*1.33,a*0.5,-k*1.33,a,0);g.bezierCurveTo(a*0.5,k*1.33,-a*0.5,k*1.33,-a,0);g.closePath();}

  function eye(X,Y,a,o,rise,grid,spark,glow){
    g.save();g.translate(X,Y);
    const k=Math.max(0.004,a*0.55*o),ri=a*0.53,lw=a*0.09;

      const hz=ri*0.12;

      const sg=g.createLinearGradient(0,scy-sr,0,scy+sr);sg.addColorStop(0,'#ffc35c');sg.addColorStop(1,'#ff9440');g.fillStyle=sg;g.beginPath();g.arc(0,scy,sr,0,Math.PI*2);g.fill();
      g.fillStyle='#8f3667';for(const [off,th] of [[0.05,0.045],[0.14,0.035],[0.23,0.026],[0.31,0.018]])g.fillRect(-sr,scy-off*ri-th*ri/2,2*sr,th*ri);

        const hs=[0.07,0.16,0.28,0.44,0.64,0.9],vs=[0,0.22,-0.22,0.55,-0.55,0.95,-0.95,1.45,-1.45,2.0,-2.0];
        const nh=Math.round(hs.length*clamp(grid*1.6,0,1)),nv=Math.round(vs.length*clamp(grid*1.6-0.5,0,1));

(function splash(){

      setTimeout(()=>{sp.remove();const f=$('sheet').querySelector('[data-focus]');if(f)f.focus();},650);}};

})();
