<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shakeout</title>
<style>
:root{--bg:#060a14;--panel:#0c1222;--panel2:#111a30;--line:#1b2540;--line2:#2a3758;--text:#e8edf8;--sub:#9aa6c4;--dim:#5c6889;
  --up:#2fd38a;--dn:#ff5a6e;--gold:#ffc94d;--cyan:#38d6d6;--violet:#9b8cff;--hunt:#ffc94d;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(10,40,70,.78),rgba(3,5,12,.92));backdrop-filter:blur(4px)}
.ov[hidden]{display:none!important}
.sheet{width:min(1000px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:26px 28px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.sheet.narrow{width:min(680px,100%)}
.kick{font:800 12px/1 var(--ui);letter-spacing:.24em;color:var(--cyan)}
.logo{font:900 clamp(46px,8vw,84px)/.95 var(--ui);letter-spacing:.08em;margin:8px 0 6px;color:#eef3ff}
.logo b{color:var(--gold)}
.lead{color:#c9d3ea;font:600 17px/1.4 var(--ui);max-width:56ch}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sheet h2{font:900 28px/1.15 var(--ui);margin:8px 0 8px}
.sheet h3{font:900 16px/1.2 var(--ui);margin:18px 0 6px}
.sheet p{color:var(--sub);margin:8px 0;max-width:76ch}
.sheet p.story{font-size:16px;color:#d5ddf0}
.sheet p.bad{color:#ff8a98;font-weight:700}
.rank{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:#0d1f33;border:1px solid #1f4566}
.rank .hat{font-size:34px;line-height:1}.rank .k{font:800 9px/1 var(--ui);letter-spacing:.14em;color:#6fb6e6}.rank .v{font:900 20px/1.2 var(--ui)}.rank .s{font:12px/1.3 var(--ui);color:var(--sub)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin:18px 0 8px}
.mis{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:border-color .15s,transform .15s}
.mis:hover{border-color:var(--cyan);transform:translateY(-2px)}
.mis.locked{opacity:.45;cursor:not-allowed}
.mis .ph{font:800 10px/1 var(--ui);letter-spacing:.14em;color:var(--violet)}
.mis .nm{font:900 18px/1.2 var(--ui)}
.mis .g{font:13px/1.4 var(--ui);color:var(--sub)}
.mis .st{margin-top:auto;font:900 18px/1 var(--ui);color:var(--gold);letter-spacing:.1em}
.mis .st.sb{font-size:11px;letter-spacing:.16em;color:var(--cyan)}
.mis .best{font:700 11px/1 var(--mono);color:var(--gold)}
.cta{background:linear-gradient(90deg,#ffb84d,#ffd36a);color:#1d1200;border:0;border-radius:12px;padding:14px 24px;font:900 15px/1 var(--ui);letter-spacing:.08em;box-shadow:0 8px 30px rgba(255,190,80,.22)}
.cta:hover{filter:brightness(1.07)}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:12px;padding:12px 16px;font:700 13px/1 var(--ui);color:var(--text)}
.ghost:hover{border-color:var(--sub)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.disc{margin-top:16px;padding:10px 12px;border-radius:10px;background:#17140a;border:1px solid #4d3f12;font:12px/1.5 var(--ui);color:#e8d48f}
.hint{font:12px/1.5 var(--ui);color:var(--dim)}
.goal,.tip{display:block;margin:10px 0;padding:12px 14px;border-radius:12px;font:15px/1.5 var(--ui)}
.goal{background:#0f2416;border:1px solid #1f5a33;color:#dff8e8}.tip{background:#0d1a2c;border:1px solid #1f4566;color:#d6e8fa}
.goal>span:first-child,.tip>span:first-child{display:inline-block;margin-right:10px;font:900 11px/1.9 var(--ui);letter-spacing:.12em;color:var(--gold)}
.goal>div,.tip>div{display:inline}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tools span{font:800 11px/1 var(--ui);padding:6px 9px;border-radius:999px;border:1px solid;background:#0b1222}
kbd{font:800 11px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line2);background:#060a14}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv .k{font:800 10px/1 var(--ui);letter-spacing:.12em;color:var(--dim)}.kv .v{font:900 22px/1.2 var(--mono);margin-top:6px}.kv .s{font:12px/1.4 var(--ui);color:var(--sub)}
.checks div{font:700 14px/1.6 var(--ui)}.checks .ok{color:var(--gold)}.checks .no{color:var(--dim)}
.lesson{margin-top:12px;padding:12px 14px;border-radius:12px;background:#1a1330;border:1px solid #3d2f7a;color:#e3dcff;font:14px/1.55 var(--ui)}
.banner{margin:10px 0;padding:10px 14px;border-radius:12px;background:#2a2108;border:1px solid #7a5d12;color:#ffe2a0}
.hb{display:grid;gap:10px;margin-top:12px}
.hb>div{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.hb .i{font-size:26px;line-height:1}.hb b{font:900 15px/1.3 var(--ui)}.hb p{margin:4px 0;font-size:13px}.hb p.spot{color:#9fe0ff}
p.small{font-size:13px}
.set{display:flex;gap:10px;align-items:center;margin:10px 0;font:600 14px var(--ui);cursor:pointer}
.set input{width:18px;height:18px}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .4s}
.gate.hide{opacity:0;pointer-events:none}
#gateBtn{background:transparent;border:1px solid rgba(160,112,240,.6);color:#d9ccff;border-radius:999px;padding:14px 28px;font:800 13px/1 var(--ui);letter-spacing:.24em;animation:pulse 2.2s ease-in-out infinite}
#gateBtn:hover{background:rgba(160,112,240,.12)}
.gate .g2{font:12px/1.4 var(--ui);color:#7d82a8}
.sp-after{position:absolute;left:0;right:0;top:52%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 16px;opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.sp-after.show{opacity:1;transform:none;pointer-events:auto}
.sp-after .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:0 0 14px;padding-left:.6em}
.sp-after .sp-title{font:900 clamp(46px,9vw,96px)/0.95 var(--ui);letter-spacing:.1em;padding-left:.1em;color:#eef3ff;text-shadow:0 8px 40px rgba(56,214,214,.25)}
.sp-after .sp-title b{color:var(--hunt)}
.sp-after .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance}
.sp-after #enterBtn{opacity:1;animation:pulse 2.2s ease-in-out 1s infinite}
@media (max-height:620px){.sp-after{top:48%}.sp-after .presents{margin-bottom:6px}}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(90deg,#0a0e20 0%,#11102a 50%,#171133 100%);transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .grid{position:absolute;left:-50%;right:-50%;bottom:-2px;height:42vh;transform:perspective(320px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(56,214,214,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(150,110,255,.5) 1px,transparent 1px);background-size:46px 46px;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%);animation:gridmove 3.2s linear infinite}
@keyframes gridmove{to{background-position:0 46px,0 0}}
#splash .glow{position:absolute;left:50%;bottom:30vh;width:70vmin;height:70vmin;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle,rgba(255,150,80,.16),rgba(167,108,255,.08) 45%,transparent 70%);pointer-events:none}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:100%}
.sp-in .fvg{width:min(640px,86vw);height:auto;display:block;filter:drop-shadow(0 10px 40px rgba(120,90,255,.25));opacity:0;animation:spIn 1s ease .1s forwards}
.sp-in .presents{font:700 12px/1 var(--ui);letter-spacing:.6em;color:#8a90b8;margin:26px 0 14px;padding-left:.6em;opacity:0;animation:spIn .8s ease .9s forwards}
.sp-in .sp-title{font:900 clamp(46px,9vw,96px)/0.95 var(--ui);letter-spacing:.1em;padding-left:.1em;color:#e8ecf1;text-shadow:0 0 40px rgba(255,107,44,.25);opacity:0;animation:spIn .9s ease 1.3s forwards}
.sp-in .sp-title b{color:var(--hunt)}
.sp-in .sp-tag{font:600 clamp(13px,1.6vw,16px)/1.5 var(--ui);color:#b9c0dc;max-width:60ch;margin-top:10px;text-wrap:balance;opacity:0;animation:spIn .8s ease 1.7s forwards}
#enterBtn{margin-top:30px;background:transparent;border:1px solid rgba(255,201,77,.6);color:#ffd98a;border-radius:999px;padding:13px 26px;font:800 12px/1 var(--ui);letter-spacing:.22em;opacity:0;animation:spIn .8s ease 2.1s forwards,pulse 2.2s ease-in-out 3s infinite}
#enterBtn:hover{background:rgba(255,107,44,.12);border-color:var(--hunt)}
.sp-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:11px/1.5 var(--ui);color:#6d7396;padding:0 16px}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,44,0)}50%{box-shadow:0 0 0 6px rgba(255,107,44,.12)}}
@media (prefers-reduced-motion:reduce){#splash .grid{animation:none}.sp-in *,#enterBtn{animation:none!important;opacity:1!important}}

</style>

<body>
<canvas id="cv" aria-label="Shakeout"></canvas>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="splash" role="dialog" aria-label="Future Vision Games presents Shakeout">
  <canvas id="introCv" aria-hidden="true"></canvas>
  <div id="gate" class="gate"><button type="button" id="gateBtn">▶&nbsp; CLICK TO START</button><div class="g2">🔊 Sound on for the full experience</div></div>
  <div id="spAfter" class="sp-after">
    <div class="presents">PRESENTS</div>
    <div class="sp-title">SHAKE<b>OUT</b></div>
    <div class="sp-tag">You are the whale. Hunt the stops, spring the trap, pump it, dump it.</div>
    <button type="button" id="enterBtn">CLICK OR PRESS ANY KEY</button>
  </div>
  <div class="sp-foot">© 2026 Future Vision Games · A fictional market · All money is simulated</div>
</div>
<script>
'use strict';

// ═══════════════════════  SHAKEOUT · market simulation (no DOM, runs in node for tuning)  ═══════════════════════
// A fictional coin, ORCA/USD perpetual. Price moves only from order flow: the crowd's flow plus yours.
// The crowd is a pool of leveraged positions ("clusters"): each has an entry, a stop (maybe), a liquidation price,
// a take-profit and a patience. Price touching a stop or a liquidation turns that position into a forced market
// order, which can cascade. You are the whale: you see where those stops and liquidations sit.
const TPC=30;                 // ticks per candle (one candle = one "minute")
const IMP=1/230000;           // log-price impact per coin of net market flow
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const clampS=(v,a,b)=>v<a?a:v>b?b:v;

function makeMarket(cfg){
  const R=mulberry32(cfg.seed>>>0||1);
  const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const M={cfg,R,gauss,t:0,P:cfg.p0,F:cfg.p0,candles:[],clusters:[],greed:cfg.greed||50,heat:0,
    me:{pos:cfg.pos||0,cash:cfg.cash,avg:cfg.pos?cfg.avg:0,fees:0,bought:0,sold:0,buyCost:0,sellGet:0,peak:0,low:0},
    pending:0,events:[],labels:[],walls:{bid:null,ask:null},tog:{absorbBid:false,absorbAsk:false,hold:false},
    programs:[],manual:0,clip:cfg.clip||250,range:null,started:false,startIdx:0,exposed:false,bust:false,
    stats:{liqLong:0,liqShort:0,stopsLong:0,stopsShort:0,bored:0,springs:0,uts:0,sos:0,sow:0,sc:0,bc:0,maxHeat:0,hunted:0,cascades:0},
    hypeT:0,hypeDir:0,fomoBoost:0,frontRun:0,scenario:null,valueK:cfg.valueK||1,lastFlow:{crowd:0,me:0},tickLiq:0};
  M.equity=()=>M.me.cash+M.me.pos*M.P;
  M.startEq=M.equity();
  newCandle(M);
  return M;
}
function newCandle(M){const c={o:M.P,h:M.P,l:M.P,c:M.P,bv:0,sv:0,lv:0,sv2:0,liqL:0,liqS:0,myB:0,myS:0,i:M.candles.length};M.candles.push(c);return c;}
function lastC(M,n){return M.candles[M.candles.length-1-n];}
function hiLo(M,n,skip=1){let h=-1e9,l=1e9;const C=M.candles;for(let i=Math.max(0,C.length-n-skip);i<C.length-skip;i++){h=Math.max(h,C[i].h);l=Math.min(l,C[i].l);}return [h,l];}
function ema(M,n){const C=M.candles;let e=C[Math.max(0,C.length-n*3)].c;const a=2/(n+1);for(let i=Math.max(0,C.length-n*3);i<C.length;i++)e+=(C[i].c-e)*a;return e;}
function ev(M,text,kind){M.events.unshift({t:M.t,c:M.candles.length-1,text,kind});if(M.events.length>60)M.events.length=60;}

// ── the crowd opens a position ──
function openCluster(M,side,arch){
  const R=M.R,P=M.P,cfg=M.cfg,g=M.greed;
  let size=Math.round(Math.exp(Math.log(200)+0.8*M.gauss())*(cfg.crowdSize||1));
  if(arch==='breakout')size=Math.round(size*(1+(side>0?g:100-g)/45));   // FOMO: breakout chasers get bigger as greed rises
  const LEVS=[3,5,10,20,50,100];const degen=(cfg.degen||0)+(side>0?(g-50):(50-g))/60;
  let li=Math.floor(R()*3+R()*3*clampS(0.5+degen,0,1.4));li=clampS(li,0,5);const lev=LEVS[li];
  const [h10,l10]=hiLo(M,10);let stop=null;
  if(R()<0.62){
    if(arch==='range'&&M.range)stop=side>0?M.range.lo*(1-0.0008-R()*0.0025):M.range.hi*(1+0.0008+R()*0.0025);
    else stop=side>0?Math.min(P*0.997,l10)*(1-0.0006-R()*0.003):Math.max(P*1.003,h10)*(1+0.0006+R()*0.003);
  }
  const liq=side>0?P*(1-0.9/lev):P*(1+0.9/lev);
  const tp=side>0?P*(1+0.005+R()*0.03):P*(1-0.005-R()*0.03);
  M.clusters.push({side,size,entry:P,stop,liq,tp,lev,age:0,patience:300+R()*2600,arch});
  return side*size;
}
// ── one tick of the market ──
function tick(M){
  const R=M.R,cfg=M.cfg,P=M.P,C=lastC(M,0),me=M.me;let crowd=0;
  // forced orders from the previous tick (stops / liquidations), plus market noise
  crowd+=M.pending;M.pending=0;
  crowd+=M.gauss()*55*(cfg.noise||1);
  // value players lean against big moves away from fair value
  crowd+=-650*M.valueK*(P-M.F)/M.F*(cfg.value||1)*(1-0.6*Math.abs(M.greed-50)/50);
  // trend followers / FOMO: chase the last few candles when greedy (or panic when fearful)
  if(M.candles.length>6){const m5=Math.log(P/lastC(M,5).c);const g=M.greed;
    const chase=m5>0?(0.4+g/70):(0.4+(100-g)/70);crowd+=m5*650*chase*(cfg.fomo||1)*(1+M.fomoBoost);}
  if(M.hypeT>0){crowd+=M.hypeDir*90;M.hypeT--;}
  // scenario drift (only used to build the history before you take over)
  if(M.scenario)crowd+=M.scenario.drift||0;
  // the crowd opens positions
  const [h20,l20]=hiLo(M,20),e20=M.candles.length>3?ema(M,20):P,inRange=M.range&&P>M.range.lo&&P<M.range.hi;
  let rate=(cfg.activity||1)*0.16*(1+Math.abs(M.greed-50)/60);
  const wb=M.walls.bid,wa=M.walls.ask;
  for(let k=0;k<3;k++){if(R()>rate/3)continue;
    let side=0,arch='random';
    if(P>h20&&R()<0.7){side=1;arch='breakout';}
    else if(P<l20&&R()<0.7){side=-1;arch='breakout';}
    else if(inRange&&R()<0.6){const f=(P-M.range.lo)/(M.range.hi-M.range.lo);if(f<0.3){side=1;arch='range';}else if(f>0.7){side=-1;arch='range';}}
    if(!side&&P<e20*0.992&&M.greed>28&&R()<0.5){side=1;arch='dip';}
    if(!side&&P>e20*1.008&&M.greed<72&&R()<0.5){side=-1;arch='fade';}
    if(!side){side=R()<0.5+(M.greed-50)/110?1:-1;}
    if(wb&&side<0&&R()<0.5)side=1;if(wa&&side>0&&R()<0.5)side=-1;     // fake walls scare the crowd
    crowd+=openCluster(M,side,arch);}
  // positions close voluntarily: take profit, boredom (time capitulation), panic
  for(let i=M.clusters.length-1;i>=0;i--){const q=M.clusters[i];q.age++;
    const pnl=(P/q.entry-1)*q.side;let p=0;
    if(q.age>q.patience)p=0.0025*(pnl<0?2.4:1)*(Math.abs(pnl)<0.004?1.6:1);
    if(q.side>0&&M.greed<25&&pnl<0)p+=0.002;if(q.side<0&&M.greed>75&&pnl<0)p+=0.002;
    if((q.side>0&&wb)||(q.side<0&&wa))p*=0.35;
    if(p&&R()<p){crowd-=q.side*q.size;M.clusters.splice(i,1);M.stats.bored+=q.size;M._bored=(M._bored||0)+q.size;}}
  if(M.clusters.length>900)M.clusters.splice(0,M.clusters.length-900);
  if(M.frontRun)crowd+=M.frontRun;
  // ── you ──
  let mine=0;const clip=M.clip;
  if(M.started&&!M.exposed&&!M.bust){
    mine+=M.manual*clip;
    // hidden iceberg orders at a price: they soak up the crowd's selling (or buying) once price reaches them
    if(M.tog.absorbBid&&crowd<0&&P<=M.tog.absorbBid*1.0015){mine+=Math.min(clip*1.6,-crowd);M._passive=true;}
    if(M.tog.absorbAsk&&crowd>0&&P>=M.tog.absorbAsk*0.9985){mine-=Math.min(clip*1.6,crowd);M._passive=true;}
    if(M.tog.hold&&M.range){const w=M.range.hi-M.range.lo,f=(P-M.range.lo)/w;
      // defend the floor hard, cap the ceiling lightly: net, the range soaks up coins
      if(f<0.3)mine+=Math.max(0,-crowd)*0.95+clip*0.45*(0.3-f)/0.3;
      else if(f>0.8)mine-=Math.max(0,crowd)*0.5;
      M._passive=true;}
    for(let i=M.programs.length-1;i>=0;i--){const g=M.programs[i];g.t++;const q=runProgram(M,g,crowd);mine+=q;if(g.done)M.programs.splice(i,1);}
    // position limit
    const lim=M.cfg.maxPos||1e9;if(me.pos+mine>lim)mine=Math.max(0,lim-me.pos);if(me.pos+mine<-lim)mine=Math.min(0,-lim-me.pos);
  }
  // ── price ──
  const net=crowd+mine,P1=P*Math.exp(net*IMP*(cfg.thin||1));M.P=P1;M.lastFlow={crowd,me:mine};
  if(mine){const px=(P+P1)/2,fee=Math.abs(mine)*px*0.0002;me.fees+=fee;me.cash-=mine*px+fee;
    if(mine>0){me.bought+=mine;me.buyCost+=mine*px;}else{me.sold-=mine;me.sellGet+=-mine*px;}
    const np=me.pos+mine;if(me.pos===0||Math.sign(np)!==Math.sign(me.pos))me.avg=px;else if(Math.abs(np)>Math.abs(me.pos))me.avg=(me.avg*Math.abs(me.pos)+px*Math.abs(mine))/Math.abs(np);
    me.pos=np;if(Math.abs(me.pos)<1e-6)me.pos=0;
    // heat: aggressive size is noticed, passive absorption much less

  const ms=MISSIONS[i],seed=(Math.random()*1e9)>>>0;

  const n=M.candles.length,rn=ms.rangeN||36;let hi=-1e9,lo=1e9;for(let k=n-rn;k<n-1;k++){hi=Math.max(hi,M.candles[k].h);lo=Math.min(lo,M.candles[k].l);}

  if(ms.cfg&&ms.cfg.greed)M.greed=Math.max(M.greed,ms.cfg.greed);

function endMission(reason){

// ── main loop ──
function loop(t){
  const dt=Math.min(0.25,(t-(lastT||t))/1000);lastT=t;
  if(MODE==='play'&&G&&!G.end&&!PAUSED&&$('ov').hidden){
    const M=G.M;M.manual=(held.buy?1:0)-(held.sell?1:0);
    acc+=dt*25*SPEED;let n=0;
    while(acc>=1&&n<400){acc-=1;n++;
      const prevLiq=M.stats.liqLong+M.stats.stopsLong+M.stats.liqShort+M.stats.stopsShort;
      tick(M);G.left--;
      const liq=M.stats.liqLong+M.stats.stopsLong+M.stats.liqShort+M.stats.stopsShort-prevLiq;
      if(liq>1500&&SPEED<4)SFX.liq(liq,M.lastFlow.crowd<0?-1:1);
      if(M.exposed||M.bust){endMission(M.exposed?'exposed':'bust');break;}
      if(G.left<=0){endMission('time');break;}}
    // new candle, labels, events, alarms
    if(M.candles.length!==G.lastCandles){G.lastCandles=M.candles.length;if(SPEED<3)SFX.candle();}
    if(M.labels.length>G.labelsSeen){G.labelsSeen=M.labels.length;const L=M.labels[M.labels.length-1];SFX.label();flash={t:L.txt,col:COL.gold,at:performance.now()};}
    const ce=M.events.filter(e=>e.kind==='casc'&&e.t>(G.lastCasc||-1));if(ce.length){G.lastCasc=M.t;SFX.casc();}
    if(M.heat>70&&performance.now()-G.lastHeatAlarm>4000){G.lastHeatAlarm=performance.now();SFX.alarm();}
    if(M.heat>55&&performance.now()-G.beat>(1400-M.heat*9)){G.beat=performance.now();SFX.beat();}
    if(n&&M.lastFlow.me&&SPEED<3&&Math.random()<0.15)(M.lastFlow.me>0?SFX.buy:SFX.sell)();
  } else acc=0;
  draw();requestAnimationFrame(loop);
}

function useTool(id){
  if(!G||G.end||MODE!=='play')return;const M=G.M;
  if(id==='clip-'){M.clip=Math.max(50,M.clip-50);store.set('so_clip',M.clip);return;}
  if(id==='clip+'){M.clip=Math.min(1500,M.clip+50);store.set('so_clip',M.clip);return;}
  if(id==='spd'){SPEED=SPEED===1?2:SPEED===2?4:1;return;}
  if(id==='pause'){PAUSED=!PAUSED;return;}
  if(id==='snd'){SFX.toggle();return;}
  if(!G.ms.tools.includes(id))return;
  if(id==='buy'||id==='sell')return;
  const ok=action(M,id);if(!ok){SFX.click();return;}
  if(['sweepDown','sweepUp','flush','squeeze','markup','markdown'].includes(id))SFX.program();
  else if(id==='hype')SFX.hype();else if(id==='fud')SFX.fud();else if(id==='wallBid'||id==='wallAsk')SFX.wall();else SFX.click();
}

  const finish=()=>{phase='after';$('spAfter').classList.add('show');$('enterBtn').focus();};
  const go=e=>{if(!sp.isConnected){window.removeEventListener('keydown',go,true);return;}if(e){e.preventDefault();e.stopPropagation();}
    if(phase==='gate'){phase='intro';$('gate').classList.add('hide');if(INTRO)INTRO.start(finish);else finish();return;}
    if(phase==='intro'){if(INTRO)INTRO.skip();return;}
    if(phase==='after'){phase='gone';if(INTRO)INTRO.stop();SFX.intro();sp.classList.add('out');window.removeEventListener('keydown',go,true);
      setTimeout(()=>{sp.remove();const f=$('sheet').querySelector('[data-focus]');if(f)f.focus();},650);}};
  sp.addEventListener('click',go);window.addEventListener('keydown',go,true);$('gateBtn').focus();
})();
requestAnimationFrame(loop);


</script>
</body>
